<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#050a18" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#38ef7d" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" stroke="rgba(0, 240, 255, 0.4)" stroke-width="2.5" />

  <!-- QR Finder Pattern: Top-Left -->
  <rect x="26" y="26" width="30" height="30" rx="7" fill="none" stroke="url(#cyanGrad)" stroke-width="4.5" filter="url(#glow)" />
  <rect x="35" y="35" width="12" height="12" rx="3" fill="#00f0ff" />

  <!-- QR Finder Pattern: Top-Right -->
  <rect x="72" y="26" width="30" height="30" rx="7" fill="none" stroke="url(#cyanGrad)" stroke-width="4.5" filter="url(#glow)" />
  <rect x="81" y="35" width="12" height="12" rx="3" fill="#00f0ff" />

  <!-- QR Finder Pattern: Bottom-Left -->
  <rect x="26" y="72" width="30" height="30" rx="7" fill="none" stroke="url(#cyanGrad)" stroke-width="4.5" filter="url(#glow)" />
  <rect x="35" y="81" width="12" height="12" rx="3" fill="#00f0ff" />

  <!-- Center Radar / Target Reticle: Bottom-Right -->
  <path d="M 72 82 L 84 82 M 84 72 L 84 84 M 94 72 L 102 72 M 102 72 L 102 84 M 84 94 L 84 102 M 84 102 L 94 102 M 102 94 L 102 102" 
        stroke="#38ef7d" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="93" cy="87" r="3.5" fill="#38ef7d" />

  <!-- Crosshair Guides -->
  <line x1="64" y1="18" x2="64" y2="28" stroke="rgba(0, 240, 255, 0.4)" stroke-width="2" stroke-linecap="round" />
  <line x1="64" y1="100" x2="64" y2="110" stroke="rgba(0, 240, 255, 0.4)" stroke-width="2" stroke-linecap="round" />
  <line x1="18" y1="64" x2="28" y2="64" stroke="rgba(0, 240, 255, 0.4)" stroke-width="2" stroke-linecap="round" />
  <line x1="100" y1="64" x2="110" y2="64" stroke="rgba(0, 240, 255, 0.4)" stroke-width="2" stroke-linecap="round" />
</svg>
